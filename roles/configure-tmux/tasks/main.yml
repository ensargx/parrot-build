---
- name: "Install Tmux"
  apt:
    name: tmux
    state: present
  become: true
  become_method: sudo
- name: "Copying Tmux Config"
  copy:
    src: "{{ role_path }}/files/.tmux.conf"
    dest: "{{ ansible_env.HOME }}"

- name: Install TPM
  git:
    repo: "https://github.com/tmux-plugins/tpm"
    dest: "{{ ansible_user_id }}/.tmux/plugins/tpm"

